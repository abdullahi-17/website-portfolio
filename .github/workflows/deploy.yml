name: Check and deploy portfolio
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --check content.js && node --check main.js
      - run: python3 scripts/check-site.py
      - name: Test artifact-only deployment and package safety
        run: python3 -m unittest discover -s tests -p '*_test.py'
      - run: bash scripts/package-site.sh
      - name: Test the packaged website in desktop and mobile Chromium
        run: npm test
      - name: Save browser reports and failure traces
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: site/
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      AWS_S3_BUCKET: abdullahiomer.com
      AWS_CLOUDFRONT_DISTRIBUTION_ID: E29CBZ3Y177V29
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v4
      - name: Download the website package that passed CI
        uses: actions/download-artifact@v4
        with:
          name: website
          path: site/
      - name: Validate the downloaded package
        run: python3 scripts/validate-package.py site
      - name: Check deployment configuration
        run: test -n "$AWS_ROLE_ARN" || { echo 'Set the repository variable AWS_ROLE_ARN from Terraform output github_deploy_role_arn'; exit 1; }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify deployment account
        run: test "$(aws sts get-caller-identity --query Account --output text)" = '043309365882'
      - run: bash scripts/deploy-site.sh
      - name: Check deployed pages and record delivery timings
        run: python3 scripts/measure-site.py https://abdullahiomer.com
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-measurements
          path: reports/
          if-no-files-found: ignore

<title id="title">Cloud portfolio architecture</title><desc id="desc">Route 53 resolves abdullahiomer.com to CloudFront. A browser requests website files through CloudFront over HTTPS. CloudFront uses origin access control to read a private S3 bucket. ACM provides the custom-domain certificate.</desc>
